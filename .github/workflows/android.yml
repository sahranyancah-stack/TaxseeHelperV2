
name: Build Taxsee Helper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/taxsee/helper
          mkdir -p app/src/main/res/values
          echo "Project setup started"

      - name: Build APK
        run: |
          echo "Android project source is not yet configured"
